name: Automated Git Workflow used by developers

on:
  push:
    branches: ['*']
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  format-and-create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Debug Branch Info
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo "repo owner: ${{ github.repository_owner }}"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: git pull --ff-only

      - name: Verify bot token
        run: |
          if [ -z "${{ secrets.BFI_BOT_TOKEN }}" ]; then
            echo "::error::BFI_BOT_TOKEN is not configured in this repo's secrets. Fork runs require it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.BFI_BOT_TOKEN }}" | gh auth login --with-token

      - name: Run Black (format instead of check)
        uses: psf/black@6305bf1ae645ab7541be4f5028a86239316178eb
        with:
          options: "."

      - name: Run isort (apply changes)
        uses: isort/isort-action@24d8a7a51d33ca7f36c3f23598dafa33f7071326
        with:
          requirements-files: ""
          sort-paths: "."
          configuration: "--profile black"

      - name: Check for formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes were needed and have been applied"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes needed"
          fi

      - name: Commit and push formatting changes
        if: steps.check-changes.outputs.changes == 'true' && github.event_name == 'push'
        run: |
          git add .
          git commit -m "Apply automatic formatting with Black and isort"
          git push

      - name: Compute PR head
        id: pr-head
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.repository_owner }}" = "bfidatadigipres" ]; then
            echo "head=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "head=${{ github.repository_owner }}:$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if PR exists
        id: check-pr
        if: steps.pr-head.outputs.head != null
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
          TARGET_HEAD: ${{ steps.pr-head.outputs.head }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo bfidatadigipres/BFI_scripts \
            --head "$TARGET_HEAD" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // ""' 2>/dev/null || echo "error")
          echo "Existing PR number: $PR_NUMBER"
          if [ "$PR_NUMBER" = "error" ]; then
            echo "Error querying GitHub API — assuming no PR exists"
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_NUMBER" ]; then
            echo "PR $PR_NUMBER already exists for branch"
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "No PR exists for branch"
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on existing PR
        if: steps.check-pr.outputs.create_pr == 'false'
        uses: peter-evans/create-or-update-comment@f5b41f6a455733f2c5f73ca67a62631e75861578
        with:
          token: ${{ secrets.BFI_BOT_TOKEN }}
          issue-number: ${{ steps.check-pr.outputs.number }}
          edit-mode: replace
          repository: bfidatadigipres/BFI_scripts
          body: |
            **🤖 Automated Workflow Status**
            Branch `${{ github.ref_name }}` already has PR #${{ steps.check-pr.outputs.number }}.
            Formatting and linting completed. No duplicate PR was created.

      - name: Create PR
        if: steps.check-pr.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
          TARGET_HEAD: ${{ steps.pr-head.outputs.head }}
        run: |
          echo "Creating PR for head $TARGET_HEAD"
          gh pr create \
            --repo bfidatadigipres/BFI_scripts \
            --base main \
            --head "$TARGET_HEAD" \
            --title "Automated PR for branch: ${{ github.ref_name }}" \
            --body "This PR was automatically created from branch: ${{ github.ref_name }}"

  lint:
    runs-on: ubuntu-latest
    needs: format-and-create-pr
    permissions:
      contents: read
    steps:
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.BFI_BOT_TOKEN }}" | gh auth login --with-token

      - name: Debug token presence
        run: |
          if [ -z "${{ secrets.BFI_BOT_TOKEN }}" ]; then
            echo "BFI_BOT_TOKEN is EMPTY"
          else
            echo "BFI_BOT_TOKEN is set"
          fi

      - name: Debug PR origin
        run: |
          echo "Head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Base repo: ${{ github.repository }}"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pylint

      - id: pylint
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed_files=($(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true))
          else
            changed_files=($(git ls-files '*.py' || true))
          fi

          mkdir -p reports
          if [ ${#changed_files[@]} -gt 0 ]; then
            python -m pylint "${changed_files[@]}" > reports/pylint-report.txt || true
          else
            echo "No Python files to lint" > reports/pylint-report.txt
          fi

          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(E[0-9]{4})/$1🚨 $2/g' reports/pylint-report.txt
          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(W[0-9]{4})/$1⚠️ $2/g' reports/pylint-report.txt
          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(I[0-9]{4})/$1ℹ️ $2/g' reports/pylint-report.txt
          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(C[0-9]{4})/$1🎨 $2/g' reports/pylint-report.txt
          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(F[0-9]{4})/$1🛑 $2/g' reports/pylint-report.txt
          perl -i -pe 's/(.*:[0-9]+:[0-9]+:\s*)(R[0-9]{4})/$1♻️ $2/g' reports/pylint-report.txt

      - name: print file
        run: cat reports/pylint-report.txt

      - name: Save Pylint report content to an environment file
        id: save_report
        run: |
          {
            pylint_report=$(cat reports/pylint-report.txt)
            echo "pylint_report<<EOF"
            echo "$pylint_report"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Compute PR head
        id: pr-head
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "${{ github.event.pull_request.head.repo.owner.login }}" ]; then
            OWNER="${{ github.event.pull_request.head.repo.owner.login }}"
          else
            OWNER="${{ github.repository_owner }}"
          fi
          if [ "$OWNER" = "bfidatadigipres" ]; then
            echo "head=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "head=$OWNER:$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if PR exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
          TARGET_HEAD: ${{ steps.pr-head.outputs.head }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo bfidatadigipres/BFI_scripts \
            --head "$TARGET_HEAD" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "error")
          echo "Found PR number: $PR_NUMBER"
          if [ "$PR_NUMBER" != "error" ] && [ -n "$PR_NUMBER" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with Full Pylint Report
        if: steps.check-pr.outputs.exists == 'true'
        uses: peter-evans/create-or-update-comment@f5b41f6a455733f2c5f73ca67a62631e75861578
        with:
          token: ${{ secrets.BFI_BOT_TOKEN }}
          issue-number: ${{ steps.check-pr.outputs.number }}
          edit-mode: replace
          repository: bfidatadigipres/BFI_scripts
          body: |
            **Automated Pylint Report** 🧑‍💻
            Here is the **formatted** Pylint report:
            ```plaintext
                  ${{ env.pylint_report }}
            ```