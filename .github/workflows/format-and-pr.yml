name: Format and open PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions: {}

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM_REPO: bfidatadigipres/BFI_scripts
      UPSTREAM_BASE: main
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Require bot token
        env:
          BOT_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
        run: |
          if [[ -z "$BOT_TOKEN" ]]; then
            echo "::error::BFI_BOT_TOKEN is not configured for this repository"
            exit 1
          fi

      - name: Verify bot can write to the fork
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
        run: |
          if ! push="$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.permissions.push' 2>/dev/null)"; then
            echo "::error::The bot cannot access ${GITHUB_REPOSITORY}. Add it as a collaborator on the fork."
            exit 1
          fi
          if [[ "$push" != "true" ]]; then
            echo "::error::The bot needs write access to ${GITHUB_REPOSITORY} to open a pull request from this fork. Add it as a collaborator with write permission."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatters
        run: pip install "black==24.10.0" "isort==5.13.2"

      - name: Apply formatting
        run: |
          black .
          isort --profile black .

      - name: Commit and push formatting changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -u
          git commit -m "Apply automatic formatting with black and isort"
          git push

      - name: Check for an existing pull request
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          HEAD_OWNER: ${{ github.repository_owner }}
        run: |
          count="$(gh api --method GET "repos/${UPSTREAM_REPO}/pulls" \
            -f head="${HEAD_OWNER}:${BRANCH}" \
            -f state=open \
            --jq 'length' 2>/dev/null || echo 0)"
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.BFI_BOT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          HEAD_OWNER: ${{ github.repository_owner }}
        run: |
          gh pr create \
            --repo "$UPSTREAM_REPO" \
            --base "$UPSTREAM_BASE" \
            --head "${HEAD_OWNER}:${BRANCH}" \
            --title "Automated PR for branch: $BRANCH" \
            --body "This PR was automatically created from branch: \`$BRANCH\`."

      - name: Trigger lint workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          HEAD_OWNER: ${{ github.repository_owner }}
        run: |
          payload="$(jq -cn \
            --arg branch "$BRANCH" \
            --arg base "$UPSTREAM_BASE" \
            --arg target_repo "$UPSTREAM_REPO" \
            --arg head_owner "$HEAD_OWNER" \
            '{event_type: "format-complete", client_payload: {branch: $branch, base: $base, target_repo: $target_repo, head_owner: $head_owner}}')"
          printf '%s' "$payload" | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
